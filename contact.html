<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5">
<title>お問い合わせ - 乞田川四畳半スタジオ 4.5st</title>
<link rel="stylesheet" href="style.css">
<style>
  /* 90年代レトロフォーム専用装飾 */
  .contact-form {
    background-color: #f0f0f0;
    border: 2px groove #ffffff;
    padding: 20px;
    margin-top: 15px;
    box-sizing: border-box;
  }
  .form-group {
    margin-bottom: 18px;
  }
  .form-label {
    display: block;
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 6px;
    color: #000080; /* レトロな紺色 */
  }
  .required-badge {
    color: #ff0000;
    font-size: 12px;
    margin-left: 4px;
  }
  .form-input, .form-textarea {
    width: 100%;
    padding: 6px 8px;
    font-family: inherit;
    font-size: 14px;
    border: 2px inset #808080;
    background-color: #ffffff;
    box-sizing: border-box;
    border-radius: 0;
  }
  .form-input:focus, .form-textarea:focus {
    outline: none;
    background-color: #fffffa;
  }
  .form-textarea {
    height: 160px;
    resize: vertical;
  }
  .form-actions {
    text-align: center;
    margin-top: 25px;
    display: flex;
    justify-content: center;
    gap: 15px;
  }
  .btn-submit, .btn-reset {
    background-color: #c0c0c0;
    border: 2px solid;
    border-color: #ffffff #808080 #808080 #ffffff;
    color: #000000;
    font-family: inherit;
    font-size: 14px;
    font-weight: bold;
    padding: 8px 25px;
    cursor: pointer;
  }
  .btn-submit:active, .btn-reset:active {
    border-color: #808080 #ffffff #ffffff #808080;
  }
</style>
</head>
<body class="is-not-home">
  <div id="site-box">
    <div class="content-wrapper">
      <div class="left-content">
        <div class="page-logo-area">
          <a href="index.html">
            <img alt="乞田川四畳半スタジオ 4.5st" class="logo-page" src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEiOvkliitE6fxe-2iiXP3PQWNdfYAWMrbM_MSNJJqNSeEdz0s9QS6jZ7xUxeqv2O5C5ufAI_CQCm5A0HFr27qvehOyDKhcd4bwIDwkJthbQWDK-5aY6O5Yn8rhMyWQ_BqBKs7qk7xjMX7LIabCeC6Es65ArY11gJKpenolF5hOqdPdRGyU87bg4MhGuKw35/s1600/logo.PNG">
          </a>
        </div>

        <div class="direct-page-title">お問い合わせ</div>
        
        <p style="font-size: 14px; line-height: 1.6; margin-bottom: 20px;">
          出演依頼、楽曲制作、取材等の各種お問い合わせは下記フォームより承っております。<br>
          必要事項をご記入の上、「送信」ボタンを押してください。
        </p>

        <!-- メール送信フォーム -->
        <form class="contact-form" action="https://formsubmit.co/enquiries@kottagawa.net" method="POST">
          
          <!-- スパム防止・転送後設定 -->
          <input type="text" name="_honey" style="display:none">
          <input type="hidden" name="_template" value="table">
          <input type="hidden" name="_captcha" value="false">

          <!-- お名前（任意） -->
          <div class="form-group">
            <label class="form-label" for="name">お名前 / 貴社名</label>
            <input class="form-input" type="text" id="name" name="お名前" placeholder="例：四畳半 太郎">
          </div>

          <!-- 返信用メールアドレス -->
          <div class="form-group">
            <label class="form-label" for="email">メールアドレス<span class="required-badge">*必須</span></label>
            <input class="form-input" type="email" id="email" name="email" required placeholder="name@example.com">
          </div>

          <!-- 件名 -->
          <div class="form-group">
            <label class="form-label" for="subject">件名<span class="required-badge">*必須</span></label>
            <input class="form-input" type="text" id="subject" name="_subject" required placeholder="例：出演依頼について">
          </div>

          <!-- 本文 -->
          <div class="form-group">
            <label class="form-label" for="message">お問い合わせ内容<span class="required-badge">*必須</span></label>
            <textarea class="form-textarea" id="message" name="本文" required placeholder="お問い合わせ内容をご入力ください"></textarea>
          </div>

          <!-- 送信ボタン -->
          <div class="form-actions">
            <button class="btn-submit" type="submit">送　信</button>
            <button class="btn-reset" type="reset">リセット</button>
          </div>
        </form>

      </div>

      <!-- 右側メニュー -->
      <div class="right-sidebar">
        <div class="button-group-side">
          <a class="btn-side" href="about.html">概 要</a>
          <a class="btn-side" href="staff.html">所属職員</a>
          <a class="btn-side" href="blog.html">制作ブログ</a>
          <a class="btn-side" href="live.html">出演情報</a>
          <a class="btn-side" href="goods.html">グッズ・物販</a>
          <a class="btn-side" href="contact.html">お問い合わせ</a>
        </div>
      </div>
    </div>
    <div class="site-footer">Since Reiwa-5th</div>
  </div>
</body>
</html>
