<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5">
<title>グッズ・物販 - 乞田川四畳半スタジオ 4.5st</title>
<link rel="stylesheet" href="style.css">
<!-- セル内改行を正しく読み取るための軽量ツール -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  /* グッズ専用のレトロ装飾 */
  .goods-price {
    font-size: 16px;
    font-weight: bold;
    color: #b30000;
    margin: 8px 0 12px 0;
  }
  .goods-buy-area {
    margin-top: 15px;
    padding-top: 10px;
    border-top: 1px dashed #c0c0c0;
    text-align: right;
  }
  .btn-booth {
    background-color: #c0c0c0;
    border: 2px solid;
    border-color: #ffffff #808080 #808080 #ffffff;
    color: #0000cc;
    font-weight: bold;
    text-decoration: none;
    display: inline-block;
    padding: 6px 16px;
    font-size: 14px;
    cursor: pointer;
  }
  .btn-booth:active {
    border-color: #808080 #ffffff #ffffff #808080;
  }
  .goods-img-box {
    margin: 12px 0;
    text-align: center;
  }
  .goods-img {
    max-width: 100%;
    max-height: 350px;
    height: auto;
    border: 1px solid #808080;
  }
</style>
</head>
<body class="is-not-home">
  <div id="site-box">
    <div class="content-wrapper">
      <div class="left-content">
        <div class="page-logo-area">
          <a href="index.html">
            <img alt="乞田川四畳半スタジオ 4.5st" class="logo-page" src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEiOvkliitE6fxe-2iiXP3PQWNdfYAWMrbM_MSNJJqNSeEdz0s9QS6jZ7xUxeqv2O5C5ufAI_CQCm5A0HFr27qvehOyDKhcd4bwIDwkJthbQWDK-5aY6O5Yn8rhMyWQ_BqBKs7qk7xjMX7LIabCeC6Es65ArY11gJKpenolF5hOqdPdRGyU87bg4MhGuKw35/s1600/logo.PNG">
          </a>
        </div>

        <div class="direct-page-title">グッズ・物販（購買部）</div>
        
        <!-- グッズ一覧エリア -->
        <div class="blog-posts" id="goods-container">
          <p style="text-align:center; font-size:14px; color:#666;">物販情報を読み込み中...</p>
        </div>
      </div>

      <!-- 右側メニュー -->
      <div class="right-sidebar">
        <div class="button-group-side">
          <a class="btn-side" href="about.html">概 要</a>
          <a class="btn-side" href="staff.html">所属職員</a>
          <a class="btn-side" href="blog.html">制作ブログ</a>
          <a class="btn-side" href="live.html">出演情報</a>
          <a class="btn-side" href="goods.html">グッズ・物販</a>
          <a class="btn-side" href="mailto:enquiries@kottagawa.net">お問い合わせ</a>
        </div>
      </div>
    </div>
    <div class="site-footer">Since Reiwa-5th</div>
  </div>

  <script>
    // ★ステップ1で取得した「goods」シートのCSV URLをここに貼り付けます
    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQzTzlj5WZKy0q1KtfLNFPG4pZLBS8FoQu9mBvAOIz0xqiIs4Cc8jkTyVcGD5-YluStfFoJ0Yh6GM3q/pub?gid=ここにgoodsシートのgid&single=true&output=csv';

    Papa.parse(csvUrl, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        const container = document.getElementById('goods-container');
        container.innerHTML = '';
        const data = results.data;

        // スプレッドシートの上から順に表示
        for (let i = 0; i < data.length; i++) {
          const row = data[i];
          const titleStr = row.title || '';
          const priceStr = row.price || '';
          const imgUrl = row.image || '';
          let bodyStr = row.body || '';
          const boothUrl = row.url || '';

          if (!titleStr && !bodyStr) continue;

          // ① 改行処理
          bodyStr = bodyStr.replace(/\r\n|\n|\r/g, '<br>');

          // ② **太字** と *斜体* の処理
          bodyStr = bodyStr.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
          bodyStr = bodyStr.replace(/\*(.+?)\*/g, '<i>$1</i>');

          // ③ [img:URL] の処理（本文中にさらに画像を足したい場合用）
          bodyStr = bodyStr.replace(/\[img:(.+?)\]/g, '<div style="margin: 15px 0; text-align: center;"><img src="$1" style="max-width: 100%; height: auto; border: 1px solid #808080;"></div>');

          // 商品画像ブロック
          let imageHtml = '';
          if (imgUrl.trim() !== '') {
            imageHtml = `<div class="goods-img-box"><img src="${imgUrl}" class="goods-img" alt="${titleStr}"></div>`;
          }

          // 価格表示ブロック
          let priceHtml = '';
          if (priceStr.trim() !== '') {
            priceHtml = `<div class="goods-price">価格：${priceStr}</div>`;
          }

          // BOOTH購入ボタンブロック
          let boothBtnHtml = '';
          if (boothUrl.trim() !== '') {
            boothBtnHtml = `
              <div class="goods-buy-area">
                <a href="${boothUrl}" class="btn-booth" target="_blank" rel="noopener noreferrer">▶ BOOTHで購入する (別窓)</a>
              </div>
            `;
          }

          const postDiv = document.createElement('div');
          postDiv.className = 'post';
          postDiv.innerHTML = `
            <h2 class="post-title">${titleStr}</h2>
            ${priceHtml}
            ${imageHtml}
            <div class="post-body">${bodyStr}</div>
            ${boothBtnHtml}
          `;
          container.appendChild(postDiv);
        }
      },
      error: function() {
        container.innerHTML = '<p style="text-align:center;">物販情報の読み込みに失敗しました。</p>';
      }
    });
  </script>
</body>
</html>
