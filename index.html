<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5">
<title>乞田川四畳半スタジオ 4.5st</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="is-home">
  <div id="site-box">
    <div class="home-header-area">
      <a href="index.html">
        <img alt="乞田川四畳半スタジオ 4.5st" class="logo-top" src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEiOvkliitE6fxe-2iiXP3PQWNdfYAWMrbM_MSNJJqNSeEdz0s9QS6jZ7xUxeqv2O5C5ufAI_CQCm5A0HFr27qvehOyDKhcd4bwIDwkJthbQWDK-5aY6O5Yn8rhMyWQ_BqBKs7qk7xjMX7LIabCeC6Es65ArY11gJKpenolF5hOqdPdRGyU87bg4MhGuKw35/s1600/logo.PNG">
      </a><br>
      <div class="counter-container">
        <span class="counter-title">アクセスカウンタ</span>
        <div class="flip-digits" id="retro-counter">
          <span class="digit">0</span><span class="digit">0</span><span class="digit">0</span><span class="digit">0</span>
          <span class="digit">0</span><span class="digit">0</span><span class="digit">0</span><span class="digit">0</span>
        </div>
      </div>
      <div class="catch-copy">
        乞田川流域に存在する、たった四畳半の小さなスタジオ<br>
        観えないモノを凝視して、そっと耳を傾けて…
      </div>
      <div class="button-group-top">
        <div class="btn-row">
          <a class="btn-top" href="about.html">概 要</a>
          <a class="btn-top" href="staff.html">所属職員</a>
          <a class="btn-top" href="index.html">制作ブログ</a>
        </div>
        <div class="btn-row">
          <a class="btn-top" href="live.html">出演情報</a>
          <a class="btn-top" href="goods.html">グッズ・物販</a>
          <a class="btn-top" href="mailto:enquiries@kottagawa.net">お問い合わせ</a>
        </div>
      </div>
    </div>
    
    <!-- ブログ記事一覧エリア -->
    <div class="blog-posts" id="blog-container">
      <p style="text-align:center; font-size:14px; color:#666;">データを読み込み中...</p>
    </div>

    <div class="site-footer">Since Reiwa-5th</div>
  </div>

  <script>
    // ▼ アクセスカウンター
    const DIGIT_COUNT = 8;
    const counterKey = "kottagawa_studio_official_pv_v1";
    function runFlipAnimation(targetNumber) {
      const counterDiv = document.getElementById("retro-counter");
      if (!counterDiv) return;
      const targetStr = Math.min(targetNumber, Math.pow(10, DIGIT_COUNT) - 1).toString().padStart(DIGIT_COUNT, '0');
      const spans = counterDiv.getElementsByClassName("digit");
      const fixed = new Array(DIGIT_COUNT).fill(false);
      for(let i = 0; i < DIGIT_COUNT; i++) {
        setTimeout(() => { fixed[i] = true; spans[i].innerText = targetStr[i]; }, 500 + (i * 500));
      }
      const interval = setInterval(() => {
        let allFixed = true;
        for (let i = 0; i < DIGIT_COUNT; i++) {
          if (!fixed[i]) {
            allFixed = false;
            let currentNum = parseInt(spans[i].innerText || 0, 10);
            spans[i].innerText = (currentNum + 1) % 10;
          }
        }
        if (allFixed) clearInterval(interval);
      }, 80);
    }
    const apiUrl = "https://countapi.mileshilliard.com/api/v1/hit/" + counterKey;
    fetch(apiUrl).then(r => r.json()).then(data => {
      let val = parseInt(data.value, 10) || 1; setTimeout(() => runFlipAnimation(val), 1000);
    }).catch(e => {
      let localCount = parseInt(localStorage.getItem(counterKey) || "0", 10) + 1;
      localStorage.setItem(counterKey, localCount); setTimeout(() => runFlipAnimation(localCount), 1000);
    });

    // ▼ スプレッドシート（ブログ用）読み込み
    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQzTzlj5WZKy0q1KtfLNFPG4pZLBS8FoQu9mBvAOIz0xqiIs4Cc8jkTyVcGD5-YluStfFoJ0Yh6GM3q/pub?gid=0&single=true&output=csv';
    
    fetch(csvUrl)
      .then(response => response.text())
      .then(csvText => {
        const rows = csvText.split('\n');
        const container = document.getElementById('blog-container');
        container.innerHTML = ''; // 読込中の文字を消す

        // 1行目（見出し）を飛ばして下からループ（最新記事を上に）
        for (let i = rows.length - 1; i >= 1; i--) {
          const row = rows[i];
          if (!row.trim()) continue; // 空行スキップ
          
          // CSVのカンマ分割（正規表現で安全に分割）
          const columns = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
          if (columns.length < 3) continue;

          const dateStr = columns[0].replace(/^"|"$/g, '').trim();
          const titleStr = columns[1].replace(/^"|"$/g, '').trim();
          let bodyStr = columns[2].replace(/^"|"$/g, '').trim();
          
          // HTMLの生成
          const postDiv = document.createElement('div');
          postDiv.className = 'post';
          postDiv.innerHTML = `
            <h2 class="post-title">${titleStr}</h2>
            <div class="post-date">投稿日時: ${dateStr}</div>
            <div class="post-body">${bodyStr}</div>
          `;
          container.appendChild(postDiv);
        }
      })
      .catch(error => {
        document.getElementById('blog-container').innerHTML = '<p style="text-align:center;">記事の読み込みに失敗しました。</p>';
      });
  </script>
</body>
</html>
