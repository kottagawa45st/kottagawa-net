      <div class="counter-container">
        <span class="counter-title">アクセスカウンタ</span>
        <div class="flip-digits" id="retro-counter">

  <script>
    const DIGIT_COUNT = 8;
    const counterKey = "kottagawa_studio_official_pv_v1";
    function runFlipAnimation(targetNumber) {
      const counterDiv = document.getElementById("retro-counter");
      if (!counterDiv) return;
      const targetStr = Math.min(targetNumber, Math.pow(10, DIGIT_COUNT) - 1).toString().padStart(DIGIT_COUNT, '0');
      const spans = counterDiv.getElementsByClassName("digit");
      const fixed = new Array(DIGIT_COUNT).fill(false);
      for(let i = 0; i < DIGIT_COUNT; i++) {
        setTimeout(() => { fixed[i] = true; spans[i].innerText = targetStr[i]; }, 500 + (i * 500));
      }
      const interval = setInterval(() => {
        let allFixed = true;
        for (let i = 0; i < DIGIT_COUNT; i++) {
          if (!fixed[i]) {
            allFixed = false;
            let currentNum = parseInt(spans[i].innerText || 0, 10);
            spans[i].innerText = (currentNum + 1) % 10;
          }
        }
        if (allFixed) clearInterval(interval);
      }, 80);
    }
    const apiUrl = "https://countapi.mileshilliard.com/api/v1/hit/" + counterKey;
    fetch(apiUrl).then(r => r.json()).then(data => {
      let val = parseInt(data.value, 10) || 1; setTimeout(() => runFlipAnimation(val), 1000);
    }).catch(e => {
      let localCount = parseInt(localStorage.getItem(counterKey) || "0", 10) + 1;
      localStorage.setItem(counterKey, localCount); setTimeout(() => runFlipAnimation(localCount), 1000);
    });
  </script>
</body>
